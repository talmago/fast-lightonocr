[package]
name = "fast-lightonocr"
version = "0.1.0"
edition = "2024"
description = "Native Rust inference engine for LightOnOCR"
license = "MIT"
publish = false

keywords = ["ocr", "onnx", "lightonocr", "inference"]
categories = ["computer-vision", "science"]

[workspace]
members = ["bindings/python"]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
fastrand = "2.5.0"
image = "0.25.10"
libloading = { version = "0.9", optional = true }
ndarray = "0.17.2"
ort = "2.0.0-rc.13"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokenizers = "0.23.1"

[features]
default = []

load-dynamic = ["ort/load-dynamic", "dep:libloading"]
cuda = ["ort/cuda"]
