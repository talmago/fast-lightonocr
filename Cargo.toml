[package]
name = "fast-lightonocr"
version = "0.1.0"
edition = "2024"
description = "Native Rust inference engine for LightOnOCR"
license = "MIT"
publish = false

keywords = ["ocr", "onnx", "lightonocr", "inference"]
categories = ["computer-vision", "science"]

[workspace]
members = ["bindings/python"]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
fastrand = "2.5.0"
image = "0.25.10"
libloading = { version = "0.9", optional = true }
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "api-27",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokenizers = "0.23.1"

[[example]]
name = "inference"
required-features = ["load-dynamic"]

[[example]]
name = "streaming"
required-features = ["load-dynamic"]

[features]
default = []

# Download and link a matching ONNX Runtime automatically.
download-binaries = [
    "ort/download-binaries",
    "ort/copy-dylibs",
    "ort/tls-rustls",
]

# Load ONNX Runtime explicitly at runtime instead of linking.
load-dynamic = ["ort/load-dynamic", "dep:libloading"]

# Enable CUDA execution provider.
cuda = ["ort/cuda"]