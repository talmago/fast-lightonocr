name: Python Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHON_PACKAGE_DIR: bindings/python

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.PYTHON_PACKAGE_DIR }}/pyproject.toml

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build source distribution
        run: |
          python -m build \
            "${PYTHON_PACKAGE_DIR}" \
            --sdist \
            --outdir dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-linux-wheel:
    name: Build wheel (linux x86_64)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        shell: bash
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y curl
            else
              yum install -y curl
            fi
          fi

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build wheel
        shell: bash
        env:
          PYTHON: /opt/python/cp311-cp311/bin/python
          MATURIN_BUILD_ARGS: --compatibility manylinux_2_28
        run: |
          "${PYTHON}" -m pip install --upgrade pip

          "${PYTHON}" -m pip wheel \
            "${PYTHON_PACKAGE_DIR}" \
            --no-deps \
            --wheel-dir dist \
            --config-settings "maturin.build-args=${MATURIN_BUILD_ARGS}"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  build-macos-wheel:
    name: Build wheel (macOS arm64)
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        env:
          MATURIN_BUILD_ARGS: --compatibility pypi
        run: |
          python -m pip install --upgrade pip

          python -m pip wheel \
            "${PYTHON_PACKAGE_DIR}" \
            --no-deps \
            --wheel-dir dist \
            --config-settings "maturin.build-args=${MATURIN_BUILD_ARGS}"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-macos-arm64
          path: dist/*.whl
          if-no-files-found: error

  inspect-distributions:
    name: Inspect distributions
    runs-on: ubuntu-latest
    needs:
      - build-sdist
      - build-linux-wheel
      - build-macos-wheel

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate package metadata
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*

      - name: Verify wheel installation
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' | head -n1)"

          test -n "$WHEEL"

          python -m venv .venv-test
          . .venv-test/bin/activate

          pip install --upgrade pip
          pip install "$WHEEL"

          python -c "import fast_lightonocr"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - inspect-distributions
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/fast-lightonocr
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist