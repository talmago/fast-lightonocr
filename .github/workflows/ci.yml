name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHON_PACKAGE_DIR: bindings/python

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.PYTHON_PACKAGE_DIR }}/pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            ruff \
            "maturin>=1.8,<2"

      #
      # Rust
      #

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check Rust
        run: cargo check --features load-dynamic

      - name: Test Rust
        run: cargo test --features load-dynamic

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      #
      # Python
      #

      - name: Check Python formatting
        run: |
          python -m ruff format \
            --check \
            "${PYTHON_PACKAGE_DIR}/python" \
            "${PYTHON_PACKAGE_DIR}/build"

      - name: Lint Python
        run: |
          python -m ruff check \
            "${PYTHON_PACKAGE_DIR}/python" \
            "${PYTHON_PACKAGE_DIR}/build"

      - name: Check Python build backend
        working-directory: ${{ env.PYTHON_PACKAGE_DIR }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          import os
          from build import backend

          os.environ.pop("ORT_DYLIB_PATH", None)
          os.environ.pop("BUILD_PROFILE", None)

          assert backend._profiled_config_settings(None)["maturin.build-args"] == []
          assert "onnxruntime>=1.28,<2" in backend.get_requires_for_build_wheel(None)

          os.environ["BUILD_PROFILE"] = "cuda"

          assert backend._profiled_config_settings(None)["maturin.build-args"] == [
              "--features",
              "cuda",
          ]
          PY

      # - name: Build Python wheel
      #   run: |
      #     python -m pip wheel \
      #       "${PYTHON_PACKAGE_DIR}" \
      #       --no-deps \
      #       --wheel-dir dist

      - name: Build Python wheel with maturin
        working-directory: ${{ env.PYTHON_PACKAGE_DIR }}
        run: |
          maturin build \
            --release \
            --out ../../dist
      
      - name: Inspect wheel contents
        run: |
          WHEEL="$(find dist -name '*.whl' | head -n1)"

          echo "Wheel:"
          echo "  $WHEEL"

          echo
          echo "=== Wheel contents ==="
          python -m zipfile -l "$WHEEL"

          echo
          echo "=== Native libraries ==="
          python - <<'PY'
          import pathlib
          import tempfile
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))

          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(wheel) as zf:
                  zf.extractall(tmp)

              for path in sorted(pathlib.Path(tmp).rglob("*")):
                  if path.suffix in {".so", ".dylib", ".dll"}:
                      print(path.relative_to(tmp))
          PY

      # - name: Verify wheel installation
      #   run: |
      #     python -m venv .venv-test
      #     . .venv-test/bin/activate

      #     python -m pip install --upgrade pip
      #     python -m pip install dist/*.whl

      #     python -c "import fast_lightonocr"