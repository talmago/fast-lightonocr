[project]
name = "fast-lightonocr"
version = "0.1.4"
description = "Python bindings for the native Rust LightOnOCR2-1B inference engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tal Almagor", email = "almagoric@gmail.com" }]
keywords = ["document-ocr", "lightonocr", "onnx", "ocr", "rust"]
dependencies = [
    "beautifulsoup4>=4.12",
    "huggingface-hub>=0.23",
    "tabulate (>=0.10.0,<0.11.0)",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/talmago/fast-lightonocr/tree/main/docs"
Homepage = "https://github.com/talmago/fast-lightonocr"
Issues = "https://github.com/talmago/fast-lightonocr/issues"
Repository = "https://github.com/talmago/fast-lightonocr"
Source = "https://github.com/talmago/fast-lightonocr"

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.28,<2",
]
cuda = [
    "onnxruntime-gpu[cuda,cudnn]>=1.28,<2",
    # ORT 1.28 CUDA EP needs CUDA 13 cublas; not included in the upstream
    # onnxruntime-gpu[cuda] extra as of 1.28.0.
    "nvidia-cublas~=13.0",
]

[dependency-groups]
dev = [
    "maturin>=1.8,<2",
    "ruff>=0.9",
]

[build-system]
requires = [
    "maturin[patchelf]>=1.13,<2",
    "packaging>=24",
    "tomli>=1.1.0; python_version < '3.11'",
]
build-backend = "fast_lightonocr_build.backend"
backend-path = ["."]

[tool.maturin]
bindings = "pyo3"
module-name = "fast_lightonocr._native"
python-source = "."
exclude = [
    { path = "fast_lightonocr_build", format = "wheel" },
    { path = "fast_lightonocr_build/**", format = "wheel" },
]

[tool.fast-lightonocr.build]
default-profile = "cpu"

[tool.fast-lightonocr.build-profiles.cpu]
cargo-features = []
build-requirements = [
    "onnxruntime>=1.28,<2",
]

[tool.fast-lightonocr.build-profiles.cuda]
cargo-features = ["cuda"]
build-requirements = [
    # Build only needs the ORT dylib for linking; CUDA/cuDNN user libs are
    # runtime deps via the `cuda` optional-extra.
    "onnxruntime-gpu>=1.28,<2",
]

[tool.ruff]
line-length = 88
src = ["fast_lightonocr", "fast_lightonocr_build"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
