[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "fast-lightonocr"
version = "0.1.0"
description = "Python bindings for the native Rust LightOnOCR2-1B inference engine"
readme = "../../README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tal Almagor", email = "almagoric@gmail.com" }]
keywords = ["document-ocr", "lightonocr", "onnx", "ocr", "rust"]
dependencies = [
    "beautifulsoup4>=4.12",
    "huggingface-hub>=0.23",
    "tabulate (>=0.10.0,<0.11.0)",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/talmago/fast-lightonocr/tree/main/docs"
Homepage = "https://github.com/talmago/fast-lightonocr"
Issues = "https://github.com/talmago/fast-lightonocr/issues"
Repository = "https://github.com/talmago/fast-lightonocr"
Source = "https://github.com/talmago/fast-lightonocr"

[dependency-groups]
dev = [
    "maturin>=1.8,<2",
    "ruff>=0.9",
]

[tool.maturin]
bindings = "pyo3"
module-name = "fast_lightonocr._native"
python-source = "python"
features = ["load-dynamic"]

[tool.ruff]
line-length = 88
src = ["python"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
