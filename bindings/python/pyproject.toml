[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "fast-lightonocr"
version = "0.1.0"
description = "Python bindings for the native Rust LightOnOCR2-1B inference engine"
readme = "../../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tal Almagor", email = "almagoric@gmail.com" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "huggingface-hub>=0.23",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Homepage = "https://github.com/talmago/fast-lightonocr"
Repository = "https://github.com/talmago/fast-lightonocr"

[tool.maturin]
bindings = "pyo3"
module-name = "fast_lightonocr._native"
python-source = "python"
features = ["load-dynamic"]
